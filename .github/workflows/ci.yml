name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -timeout 60s -v ./...

  test-iouring:
    name: Test Linux io_uring variant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: go vet (iouring tag)
        run: go vet -tags iouring ./...
      - name: go build (iouring tag)
        run: go build -tags iouring ./...
      - name: go test (iouring tag)
        run: go test -tags iouring -timeout 60s -v ./...

  cross-compile:
    name: Cross-compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: build linux/amd64
        run: GOOS=linux GOARCH=amd64 go build ./...
      - name: build linux/arm64
        run: GOOS=linux GOARCH=arm64 go build ./...
      - name: build darwin/amd64
        run: GOOS=darwin GOARCH=amd64 go build ./...
      - name: build darwin/arm64
        run: GOOS=darwin GOARCH=arm64 go build ./...
      - name: build windows/amd64
        run: GOOS=windows GOARCH=amd64 go build ./...

  stress-test:
    name: Stress Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Install hey for benchmarking
        run: go install github.com/rakyll/hey@latest
      - name: Run stress test
        run: chmod +x ./stress_test.sh && ./stress_test.sh -n 5000 -c 100
